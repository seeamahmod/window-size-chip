<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Device preview</title>
  <link rel="stylesheet" href="frame.css">
</head>
<body>
  <header id="bar">
    <div class="who">
      <span class="swatch" id="swatch"></span>
      <span id="name"></span>
      <span class="color" id="colorName"></span>
    </div>
    <div class="size" id="size"></div>
    <div class="actions">
      <button id="rotate" title="Switch between vertical and horizontal">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"></rect><path d="M2 12a10 10 0 0 0 5 8.66"></path><path d="M2 16v-4h4"></path></svg>
        <span id="rotateLabel">Horizontal</span>
      </button>
      <button id="reload" title="Reload the page">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 3v6h-6"></path></svg>
        Reload
      </button>
      <button id="exit" class="primary" title="Back to the normal page">Exit</button>
    </div>
  </header>
  <main id="stage">
    <div id="fit"><div id="device"></div></div>
  </main>
  <script src="presets.js"></script>
  <script src="frame.js"></script>
</body>
</html>
