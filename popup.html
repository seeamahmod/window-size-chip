<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Window Size</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div>
      <div class="label">Window</div>
      <div class="now" id="now">—</div>
    </div>
    <div class="right">
      <div class="label">Viewport</div>
      <div class="vp" id="vp">—</div>
    </div>
  </header>

  <div class="emu hidden" id="emu">
    <span id="emuLabel"></span>
    <button id="reset">Reset</button>
  </div>

  <div class="status hidden" id="status"></div>

  <section>
    <h2>Desktop <small>resizes the window</small></h2>
    <div class="grid" id="desktop"></div>
  </section>

  <section>
    <h2>Tablet &amp; mobile position</h2>
    <div class="seg" role="group" aria-label="Tablet and mobile position">
      <button type="button" id="oPortrait" aria-pressed="true">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"></rect></svg>
        Vertical
      </button>
      <button type="button" id="oLandscape" aria-pressed="false">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="10" rx="2"></rect></svg>
        Horizontal
      </button>
    </div>
  </section>

  <section>
    <h2>Tablet <small>emulated</small></h2>
    <div class="list" id="tablet"></div>
  </section>

  <section>
    <h2>Mobile <small>emulated</small></h2>
    <div class="list" id="mobile"></div>
  </section>

  <section>
    <h2>Custom</h2>
    <form class="custom" id="custom">
      <input type="number" id="cw" min="200" max="4000" placeholder="Width" required>
      <span>×</span>
      <input type="number" id="ch" min="200" max="4000" placeholder="Height">
      <button type="submit">Go</button>
    </form>
  </section>

  <footer>Copyright (c) 2026 Seeam Ahmod</footer>

  <script src="presets.js"></script>
  <script src="popup.js"></script>
</body>
</html>
