<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Small promo tile</title>
<style>
  html, body { margin: 0; }
  body {
    width: 440px; height: 280px; overflow: hidden;
    background: #0e1612; color: #f1f4f2;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 0 36px; box-sizing: border-box;
  }
  .row { display: flex; align-items: center; gap: 14px; }
  img { width: 56px; height: 56px; }
  h1 { margin: 0; font-size: 30px; letter-spacing: -.5px; }
  p { margin: 0; font-size: 19px; line-height: 1.35; color: #b9c6bf; }
  em { font-style: normal; color: #34c77b; font-weight: 700; }
</style>
</head>
<body>
  <div class="row"><img src="../../icons/icon128.png" alt=""><h1>Shrink Window</h1></div>
  <p>Every screen size. <em>One click away.</em><br>Exact desktop, tablet and phone sizes.</p>
</body>
</html>
